account_id = "3f8099bcfe776445db674c284829eb82"
name = "quotation"
main = "worker/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true
keep_vars = true # Preserve runtime values entered in the Cloudflare dashboard.

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/owner", "/owner/*"]

[[d1_databases]]
binding = "DB"
database_name = "ume-interiors-studio"
database_id = "94fa0cb5-d837-44f1-a807-2ad545e91c6a" # Replace after creating your D1 database.
migrations_dir = "migrations"

[observability]
enabled = true

[observability.issues]
enabled = true

[observability.logs]
enabled = true

[observability.traces]
enabled = true

